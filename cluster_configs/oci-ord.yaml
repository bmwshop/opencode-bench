executor: slurm

ssh_tunnel:
  host: cs-oci-ord-login-01
  # ------------------------------- Fill this up! -------------------------------
  user: ${USER}  # your username; or resolved from ${USER} environment variable ; or can be null which resolved from ${USER} environment variable
  job_dir: /lustre/fsw/portfolios/llmservice/users/${USER}/nemo-run/
  identity: ${NEMO_SKILLS_OCI_ORD_SSH_IDENTITY}
  # -----------------------------------------------------------------------------

# if you're running directly from cluster, you only need to define job_dir and shouldn't use ssh_tunnel
# job_dir: <some location on slurm cluster to keep job metadata, uploaded code and generated sbatch files>

account: llmservice_nemo_reasoning
partition: polar,polar3,polar4,grizzly
cpu_partition: cpu_short
job_name_prefix: ""

dependency_type: "afterany"

containers:
  vllm: /lustre/fsw/portfolios/llmservice/users/igitman/images/nemo-skills-vllm-v0.19.1.sqsh
  sandbox: /lustre/fsw/portfolios/llmservice/users/igitman/images/nemo-skills-sandbox-latest.sqsh
  nemo-skills: /lustre/fsw/portfolios/llmservice/users/igitman/images/nemo-skills-latest.sqsh

mounts:
  - /lustre/fsw/portfolios/llmservice/users/igitman/hf_models:/hf_models
  - /lustre/fsw/portfolios/llmservice/users/igitman/images/swe-bench:/swe-bench-images
  - /lustre/fsw/portfolios/llmservice/users/smajumdar/hf:/hf
  # you also need to mount your own workspace folder (or any other folder you need)
  # - /lustre/fsw/portfolios/llmservice/users/igitman:/workspace

# optional env variables
env_vars:
  - "PYTHONUTF8=1"
  - "HF_HOME=/hf"

timeouts:
  polar,polar3,polar4,grizzly: 04:00:00
  interactive: 04:00:00
  interactive_singlenode: 04:00:00
  cpu_short: 04:00:00

