executor: slurm

# Use this when running directly on the CW-DFW login node.
# Unlike cw-dfw.yaml, this config does not require an ssh_tunnel.identity.
job_dir: /lustre/fsw/portfolios/llmservice/users/drekesh/nemo-run/

account: nemotron_reason_code
# account: llmservice_nemotron_super
partition: batch,batch_short,interactive
cpu_partition: cpu_short
job_name_prefix: ""

dependency_type: "afterany"

containers:
  vllm: /lustre/fsw/portfolios/llmservice/users/igitman/images/nemo-skills-vllm-v0.19.1.sqsh
  sandbox: /lustre/fsw/portfolios/llmservice/users/igitman/images/nemo-skills-sandbox-latest.sqsh
  nemo-skills: /lustre/fsw/portfolios/llmservice/users/igitman/images/nemo-skills-latest.sqsh

mounts:
  - /lustre/fsw/portfolios/llmservice/users/igitman/hf_models:/hf_models
  - /lustre/fsw/portfolios/llmservice/users/igitman/images/swe-bench:/swe-bench-images
  - /lustre/fsw/portfolios/llmservice/users/drekesh/hf:/hf
  # Add extra mounts here if the job needs direct access to more paths.

env_vars:
  - "HF_HOME=/hf"

timeouts:
  batch: 03:00:00
  batch_short: 02:00:00
  interactive: 01:00:00
  cpu_short: 03:00:00
